<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caerusia – Diák nézet</title>
<style>
:root{--bg:#10131a;--panel:#1a2130;--panel2:#222b3b;--text:#f5f2e8;--muted:#aab4c4;--gold:#d8b45c;--line:#344057;--purple:#8e75d6}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#29344b,#10131a 44%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 24px;background:#10131af2;border-bottom:1px solid var(--line)}
h1{margin:0;color:var(--gold);font:700 28px Georgia,serif} .sub{color:var(--muted);font-size:12px;margin-top:3px}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap} label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}
select,button{font:inherit;background:#0e141e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px} button{cursor:pointer;font-weight:700} button.active{background:var(--gold);color:#1d1a13}
main{padding:20px 24px} #status{color:var(--muted);margin-bottom:12px} .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;box-shadow:0 9px 25px #0004}
.card:hover{border-color:var(--gold)} .name{font-weight:800;font-size:18px}.student-head{display:flex;align-items:flex-start;gap:7px;width:100%}.student-head .student-name-wrap{flex:1;min-width:0}.class-crest{margin-left:auto;width:46px;height:46px;object-fit:contain;flex:0 0 46px} .school{color:var(--muted);font-size:12px;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0} .badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px} .class{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0} .stat{background:#111824;border-radius:10px;padding:8px;text-align:center} .stat strong{display:block;font-size:19px} .stat span{font-size:10px;color:var(--muted)}
.progress{height:6px;background:#0f141d;border-radius:999px;overflow:hidden} .progress div{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold))}
.mini{font-size:10px;color:var(--muted);margin-top:4px}
dialog{width:min(760px,95vw);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#171d28;color:var(--text);padding:18px} dialog::backdrop{background:#000b}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:start} .dhead h2{margin:0} .ability{border-left:4px solid var(--gold);background:#222a38;padding:11px;border-radius:8px;margin:14px 0;line-height:1.45}
.skill{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0} .skill p{margin:4px 0 0;color:var(--muted);font-size:12px} .skill small{color:var(--gold)} .close{background:#303a4c}
.list .grid{grid-template-columns:1fr} .list .card{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;align-items:center}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}} @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.list .card{display:block}}
</style></head>

const CLASSES={
Wizard:{ability:"Wizards gain double Experience Points for tests. End of lesson: spend 50% of the current lesson Mana value to gain the current lesson XP value.",skills:[[1,"+1%","Gain +1% in a test.",100],[3,"Test Me","Apply for an oral test next lesson about an issue of this lesson.",75],[5,"Double Point","Double the points you got for a task in a test, up to the task maximum.",150],[7,"Enhancement Ritual","Improve your just received test mark by 1.",200],[8,"Bend Reality","Gain a 100% value mark 5 in the register.",200]]},
Adventurer:{ability:"Adventurers gain double Pet Food. End of lesson: roll a d6; on 4+ gain +10% of the XP earned during this lesson.",skills:[[1,"No homework, no problem","Do not gain a Curse Point if homework is not done.",250],[3,"Rest","Do not participate in a normal activity of maximum 5 minutes.",100],[5,"Sleep","Invisibility for one lesson; may choose not to participate in activities.",350],[7,"Insider Information","Ask the teacher maximum 3 yes/no questions during a test.",200],[8,"One with the Shadows","Do not write a test which results in a maximum 100% value mark.",200]]},
Warrior:{ability:"Warriors gain double Experience Points for Duels. End of lesson: gain +1 Gold.",skills:[[1,"Triple Attack","Attack three times in a row in a Duel.",20],[3,"Double XP","Gain double XP for providing a correct answer.",10],[5,"Block","Block an Attack in a Duel.",50],[7,"Medal of Honour","Get a 100% value 5 by consuming 10 Duel victories.",200],[8,"March through the Battlefield","Gain +100% on a test.",200]]},
Bard:{ability:"Bards gain +10% Manna Points in Divine Blessing. End of lesson: choose another student and give them the current lesson XP value.",skills:[[1,"Give +1%","Give someone +1% in a test.",150],[3,"Assist","Assist someone participating in a Duel by giving the correct answer.",30],[5,"Erase","Erase a Curse Point for someone.",200],[7,"Voyage","All your Clanmates gain 150 Experience Points.",200],[8,"Song of Paradise","All your Clanmates gain +15% on a test.",200]]},
Warsmith:{ability:"Warsmiths gain double Experience Points for Quest. End of lesson: roll a d6; on 5+ gain a random Common Magic Item.",skills:[[1,"More Material","Gain +1 Material for a Quest; once for each Quest when doing several.",50],[3,"Money Maker","Get X Gold.","X×10"],[5,"Get Magic Item","Gain a Magic Item of maximum Very Rare quality.",250],[7,"Feels like Home","Look at a previously written handwritten A5 note for 5 minutes during a test.",200],[8,"Stolen Intelligence","Gain a copy of next day's test.",200]]}
};
let students=[],groups=[];
function level(xp){let l=1;for(const [n,t] of LEVELS)if((xp||0)>=t)l=n;return l}
function grp(s){return s.group || (s.key||'').split('|')[0] || 'Csoport'}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){
 try{
  const r=await fetch(URL+'/rest/v1/app_state?id=eq.main&select=data,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});
  if(!r.ok)throw new Error('Felhő hiba: '+r.status);
  const row=(await r.json())[0]; students=row?.data?.students||[];
  groups=[...new Set(students.map(grp))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'hu'));
  const sel=document.getElementById('group'); sel.innerHTML=groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.onchange=render; render();
  document.getElementById('status').textContent='Utolsó felhőfrissítés: '+(row?.updated_at?new Date(row.updated_at).toLocaleString('hu-HU'):'–');
 }catch(e){document.getElementById('status').textContent='Nem sikerült betölteni az adatokat: '+e.message}
}
function render(){
 const g=document.getElementById('group').value;
 const arr=students.filter(s=>grp(s)===g).sort((a,b)=>(a.name||'').localeCompare(b.name||'','hu'));
 document.getElementById('grid').innerHTML=arr.map(s=>{
  const lv=level(s.xp),next=LEVELS.find(x=>x[0]===lv+1)?.[1],prev=LEVELS.find(x=>x[0]===lv)?.[1]||0,pct=next?Math.max(0,Math.min(100,((s.xp-prev)/(next-prev))*100)):100;
  return `<div class="card" data-key="${esc(s.key)}"><div class="student-head"><div class="student-name-wrap"><div class="name">${esc(s.name)}</div><div class="school">${esc(s.school_class||'')}</div></div>${CLASS_ICONS[s.character_class]?`<img class="class-crest" src="${CLASS_ICONS[s.character_class]}" alt="${esc(s.character_class)} címer">`:``}</div><div class="badges"><span class="badge class">${esc(s.character_class||'No Class')}</span><span class="badge">${esc(s.clan||'No Clan')}</span><span class="badge">Lv ${lv}</span></div></div><div class="stats"><div class="stat"><strong>${s.xp||0}</strong><span>XP</span></div><div class="stat"><strong>${s.mp||0}</strong><span>MP</span></div><div class="stat"><strong>${s.cp||0}</strong><span>CP</span></div><div class="stat"><strong>${s.gc||0}</strong><span>Gold</span></div></div><div><div class="progress"><div style="width:${pct}%"></div></div><div class="mini">${next?`Következő szint: ${next} XP`:'Maximum szint'}</div></div></div>`;
 }).join('');
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProfile(c.dataset.key));
}
function openProfile(key){
 const s=students.find(x=>x.key===key);if(!s)return; const lv=level(s.xp),cl=CLASSES[s.character_class];
 pn.textContent=s.name; ps.textContent=s.school_class||'';
 pb.innerHTML=`<div class="stats"><div class="stat"><strong>${s.xp||0}</strong><span>XP</span></div><div class="stat"><strong>${s.mp||0}</strong><span>MP</span></div><div class="stat"><strong>${s.cp||0}</strong><span>CP</span></div><div class="stat"><strong>${s.gc||0}</strong><span>Gold</span></div></div><div class="badges"><span class="badge class">${esc(s.character_class||'No Class')}</span><span class="badge">${esc(s.clan||'No Clan')}</span><span class="badge">Level ${lv}</span></div>${cl?`<div class="ability"><strong>${esc(s.character_class)} Class Ability</strong><br>${esc(cl.ability)}</div><h3>Skillek</h3>${cl.skills.map(k=>`<div class="skill"><strong>Lv ${k[0]} – ${esc(k[1])}</strong> <small>• ${esc(k[3])} MP</small><p>${esc(k[2])}</p></div>`).join('')}`:''}`;
 profile.showModal();
}
tiles.onclick=()=>{main.classList.remove('list');tiles.classList.add('active');list.classList.remove('active')};
list.onclick=()=>{main.classList.add('list');list.classList.add('active');tiles.classList.remove('active')};
load(); setInterval(load,30000);
</script></body></html>
