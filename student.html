<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caerusia – Diák nézet</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f17}iframe{width:100%;height:100%;border:0;display:block;background:#0b0f17}</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Caerusia – Diák nézet"></iframe>
<script>
const frame=document.getElementById('app');
function applyStudentView(){
  let d; try{d=frame.contentDocument}catch(e){return}
  if(!d||!d.body)return;
  d.title='Caerusia – Diák nézet';
  ['duelBtn','testResultsBtn','settingsBtn','clansBtn','historyBtn','backupBtn'].forEach(id=>{
    const e=d.getElementById(id);if(e)e.style.display='none';
  });
  d.querySelectorAll('.bottom,.absent-btn,.control-row,.curse-actions').forEach(e=>e.style.display='none');
  d.querySelectorAll('.class-ability-btn').forEach(e=>{e.disabled=true;e.style.pointerEvents='none'});
  const gs=d.getElementById('groupSelect');
  if(gs){gs.disabled=false;gs.removeAttribute('aria-disabled');gs.style.pointerEvents='auto';gs.style.opacity='1'}
  const brand=d.querySelector('.brand p');if(brand)brand.textContent='Fantasy English – diák nézet';
  d.querySelectorAll('dialog input,dialog select,dialog textarea').forEach(e=>{e.disabled=true;e.readOnly=true});
  d.querySelectorAll('dialog button').forEach(b=>{
    const t=(b.textContent||'').trim().toLowerCase();
    const close=t==='bezárás'||t==='mégse'||/close/i.test(b.id||'');
    if(!close)b.disabled=true;
  });
}
frame.addEventListener('load',()=>{
  applyStudentView();
  try{
    const d=frame.contentDocument;
    new MutationObserver(applyStudentView).observe(d.documentElement,{subtree:true,childList:true});
    setInterval(applyStudentView,750);
  }catch(e){}
});
</script>
</body>
</html>
